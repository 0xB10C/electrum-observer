[package]
name = "electrum-observer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# Tor, in process, so that no `tor` daemon and no SOCKS proxy has to exist on
# a host the NixOS module deploys this to. The feature selection is crawler's
# and for crawler's reasons: arti calls its defaults non-additive and the
# default set pulls in native-tls, which would be a second TLS stack beside
# the rustls below, so the defaults are off and the five that are wanted are
# named. `compression` is one of the defaults and is kept, so the directory is
# still fetched compressed. `static-sqlite` compiles the amalgamation arti's
# directory cache wants into the binary rather than asking the host for a
# libsqlite3, which is the choice `rusqlite`'s `bundled` already makes below.
# `onion-service-client` is the half of arti this crate exists for. `rustls`
# resolves to the same rustls 0.23 as below, so the graph has one TLS
# implementation and one crypto provider in it -- `ring`, because that is the
# only provider feature anything here turns on, which matters: arti builds its
# client configuration from the process-wide default provider rather than from
# one passed in, and rustls installs that from the crate features only when
# exactly one of them is on.
arti-client = { version = "0.48", default-features = false, features = [
  "tokio",
  "rustls",
  "compression",
  "onion-service-client",
  "static-sqlite",
] }
# `Chain::genesis_hash`, which every connection checks `server.features`
# against at the handshake. Also the 80-byte header parsing, which is the
# other reason it is here rather than a table of five hashes.
bitcoin = "0.32"
# The CLI: a global --config and one subcommand per thing the binary does.
clap = { version = "4", features = ["derive"] }
# Hexadecimal for the content addresses: `blobs.sha256` keys a probe result
# by the hash of its JSON text, and the same function hashes the
# configuration file into `meta.config_sha256`.
hex = "0.4"
# Resolution, with every A and AAAA record of every lookup kept in
# `dns_resolutions`. hickory rather than tokio's `to_socket_addrs`, which goes
# through getaddrinfo on a blocking thread and hands back a deduplicated,
# reordered list with no way to ask what the answer actually was -- and which
# cannot be pointed at `dns.upstream`. Default features: the system
# configuration reader and the tokio runtime, and none of the encrypted
# transports, so no second rustls provider.
hickory-resolver = "0.26"
# The descriptor limit, raised at startup because every monitored server
# holds its connection open for the lifetime of the process (see `fdlimit`).
libc = "0.2"
# The database, which is the product of this daemon rather than a cache of
# it. `bundled` so that the file does not depend on whichever SQLite the host
# carries: WAL and `ON CONFLICT` upserts are both version-sensitive, and a
# collector that writes a different file on a different machine is not one
# database.
#
# Held at 0.40 rather than the newest: `libsqlite3-sys` declares
# `links = "sqlite3"`, so a dependency graph may contain exactly one of it,
# and arti's directory cache is a rusqlite database too -- `tor-dirmgr` 0.48
# asks for `>=0.36, <0.41`. 0.40 is the newest version both can have.
rusqlite = { version = "0.40", features = ["bundled"] }
# TLS for the `s` ports. The `ring` provider rather than the default
# aws-lc-rs: aws-lc-rs wants cmake and a C toolchain at build time, which a
# `nix build` of this crate would have to carry for no gain, and a graph that
# ends up with both providers compiled in makes rustls refuse to pick one at
# runtime (the lesson of fork-observer's Cargo.toml). The provider is passed
# to the `ClientConfig` builder explicitly rather than installed as the
# process default, so nothing here depends on which crate ran first.
# `tls12` because a good share of Electrum servers have never offered 1.3.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
# `Endpoint` is serialised as its canonical string into the config file and
# the database, so the derive belongs to the type itself and not only to the
# settings module that reads it.
serde = { version = "1", features = ["derive"] }
# Probe results, resolved address lists, certificate SANs and advertised
# peer features are all stored as JSON text, and the content address of a
# result is the sha256 of exactly that text, so the serialiser is part of
# the data model and not a test convenience.
# It is also the wire format: `Value` rather than typed messages, because
# what a server answers is kept verbatim for comparison across servers, and a
# type that only admits what the protocol documents would normalise away the
# differences this tool exists to record.
serde_json = "1"
# The configuration file itself. serde_yaml rather than the `config` crate
# crawler uses: there is one source and no layering, and a plain
# deserialise is what makes `deny_unknown_fields` catch a typo.
serde_yaml = "0.9"
# The content addresses themselves. bitcoin's hashes would do the same
# arithmetic, but those types are block hashes, and a fee histogram is not.
sha2 = "0.10"
# `macros` and `time` are for the tests as much as for the binary: the
# runtime itself is built by hand in `main`, but `#[tokio::test]` and the
# bounded waits in `shutdown` need them.
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "time",
  "sync",
] }
# The rustls handshake over a tokio stream; it re-exports nothing this crate
# needs that `rustls` does not already give it, so only the connector is used
# from here. Same provider selection as `rustls` above, for the same reason.
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The presented certificate into the columns of `tls_certs`: subject, issuer,
# SANs and validity. Parsing is best effort and never refuses a connection --
# a certificate this cannot read is still recorded by its hash and its bytes,
# because recording is the job.
x509-parser = "0.18"
# The one HTTP request this crate makes: the 1209k server table, fetched by
# `import 1209k`. Blocking, which is what that subcommand is, and small enough
# that a second TLS stack is not worth avoiding; rustls rather than the
# default features, as in crawler, so that no build of this depends on the
# host's OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# A self-signed certificate for the TLS tests, generated in the test rather
# than checked in: a fixture certificate expires, and a dial test that starts
# failing on a date is worse than no test. `ring` and no default features, so
# the tests do not drag in the aws-lc-rs toolchain the dependencies above
# exist to avoid.
rcgen = { version = "0.14", default-features = false, features = [
  "crypto",
  "ring",
] }
# Temporary directories for the settings tests, which write a config file
# and a server list, and for the store tests, which want a real file: WAL
# and the busy timeout are not observable on `:memory:`.
tempfile = "3"
# `start_paused`, so that the store's flush interval is tested by advancing
# the clock rather than by sleeping through it.
# Also the request-timeout tests of `jsonrpc`. A dev-dependency and nothing
# else: the feature replaces the clock, which is the last thing a collector
# of timestamps should ship with.
# `net` is for the mock Electrum server of `tests/common/mock_server.rs`,
# which binds a real loopback socket because what the session tests exercise
# is a session that dials an address. The library itself gains `net` in step
# 7 with `dial`; until then only the tests open sockets.
tokio = { version = "1", features = ["net", "test-util"] }

[features]
# Turns checks that only warn into hard failures. Nothing reads it yet.
strict = []

[lib]
name = "electrum_observer"
path = "src/lib.rs"

[[bin]]
name = "electrum-observer"
path = "src/main.rs"
